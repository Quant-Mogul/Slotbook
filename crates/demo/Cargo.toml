[package]
name = "demo"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "Runs the full Slotbook demo (steps 1 to 8) against a cluster and prints transaction links"

[[bin]]
name = "slotbook-demo"
path = "src/main.rs"

[dependencies]
anchor-lang = "=1.1.2"
anchor-spl = { version = "=1.1.2", default-features = false, features = ["associated_token", "token", "token_2022", "token_2022_extensions"] }
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
merkle = { path = "../merkle" }
serde_json = "1"
slotbook = { path = "../../programs/slotbook", features = ["no-entrypoint"] }
solana-client = "3.1.10"
solana-commitment-config = "3.1.0"
solana-keypair = "3.0.1"
solana-signer = "3.0.0"
solana-transaction = "3.0.2"

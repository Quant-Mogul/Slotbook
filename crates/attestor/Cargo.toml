[package]
name = "attestor"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "RPC ledger replay attestor: discovery, balances, snapshot, resolve"

[dependencies]
anyhow = "1"
bs58 = "0.5"
clap = { version = "4.5", features = ["derive"] }
merkle = { path = "../merkle" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
snapshot = { path = "../snapshot" }
solana-client = "3.1.10"
solana-commitment-config = "3.1.0"
solana-pubkey = "3.0.0"
solana-signature = "3.0"
thiserror = "2"

[dev-dependencies]
litesvm = "0.10.0"
litesvm-token = "0.10.0"
solana-address = "2.9"
solana-keypair = "3.0.1"
solana-signer = "3.0.0"

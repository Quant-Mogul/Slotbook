name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  SOLANA_VERSION: "3.1.10"
  ANCHOR_VERSION: "1.1.2"
  CARGO_TERM_COLOR: always

jobs:
  build-and-test:
    name: build-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # Pin guard: fail if Cargo.lock drifts from the brief's pins.
      - name: Check pinned versions in Cargo.lock
        run: |
          check() {
            got=$(grep -A1 "^name = \"$1\"$" Cargo.lock | grep '^version' | sed 's/version = "\(.*\)"/\1/' | sort -u)
            if [ -n "$got" ] && [ "$got" != "$2" ]; then
              echo "::error::$1 is '$got' in Cargo.lock, expected $2"; exit 1
            fi
            echo "$1 = ${got:-not used yet} OK"
          }
          check anchor-lang 1.1.2
          check anchor-spl 1.1.2
          check litesvm 0.10.0
          check solana-keccak-hasher 3.1.0

      # Installs the toolchain named in rust-toolchain.toml (1.89.0).
      - name: Install Rust from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2

      - name: Cache Solana CLI
        id: cache-solana
        uses: actions/cache@v4
        with:
          path: ~/.local/share/solana
          key: solana-${{ env.SOLANA_VERSION }}

      - name: Install Solana CLI ${{ env.SOLANA_VERSION }}
        if: steps.cache-solana.outputs.cache-hit != 'true'
        run: sh -c "$(curl -sSfL https://release.anza.xyz/v${SOLANA_VERSION}/install)"

      - name: Add Solana to PATH
        run: echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"

      - name: Cache Anchor CLI
        id: cache-anchor
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/anchor
          key: anchor-cli-${{ env.ANCHOR_VERSION }}

      - name: Install Anchor CLI ${{ env.ANCHOR_VERSION }}
        if: steps.cache-anchor.outputs.cache-hit != 'true'
        working-directory: /tmp
        run: cargo install anchor-cli --version ${ANCHOR_VERSION} --locked

      - name: Tool versions
        run: |
          rustc --version
          solana --version
          anchor --version

      - name: Default keypair for anchor
        run: solana-keygen new --no-bip39-passphrase --silent --outfile ~/.config/solana/id.json

      # anchor build must run first: the LiteSVM tests load target/deploy/slotbook.so.
      # --ignore-keys: the program keypair is (correctly) not in git, so CI would
      # otherwise fail the keypair vs declare_id check. declare_id in lib.rs stays the source of truth.
      - name: anchor build
        run: anchor build --ignore-keys

      # --locked fails the job if Cargo.lock would change (catches pin drift).
      - name: cargo test
        run: cargo test --workspace --locked

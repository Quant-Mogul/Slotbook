[package]
name = "issuer-scripts"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "Issuer-side Token-2022 and Token ACL demo scripts for Slotbook"

[dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
solana-client = "3.1.10"
solana-instruction = "3.4"
solana-keypair = "3.1"
solana-pubkey = "3.0"
solana-signer = "3.0"
solana-system-interface = { version = "2.0", features = ["bincode"] }
solana-transaction = "3.1"
spl-associated-token-account-interface = "2.0"
spl-token-2022-interface = "2.1"
spl-token-metadata-interface = "0.8"
